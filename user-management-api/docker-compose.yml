services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: user_management
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or the environment}
      JWT_TTL: ${JWT_TTL:-24h}

volumes:
  mongo-data:
